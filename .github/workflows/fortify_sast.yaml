name: SAST Using Fortify

on:
  push:
    branches:
      - fortify-sast

jobs:
  run_analysis:
    name: Run Analysis
    runs-on: [self-hosted, sec]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          path: navigation2
      - name: Run analysis
        id: run_analysis
        run: |
          docker run --rm \
              -v ./navigation2:/opt/overlay_ws/src/navigation2 \
              -v ./results:/opt/results \
              -v navigation2_sast_ccache:/tmp/.ccache \
              -v navigation2_sast_build:/opt/overlay_ws/build \
              navigation2:humble-sast \
              bash /opt/overlay_ws/src/navigation2/fortify_sast/analyze_in_container.sh
      - name: Upload Analysis Results
        uses: actions/upload-artifact@v6
        with:
          path: results/navigation2_sast_result.fpr
